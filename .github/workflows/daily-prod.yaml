name: Daily Production PR

on:
  schedule:
    #  6 PM PST / 7 PM PDT (cron is UTC; shifts by 1h across DST)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-diff:
    name: "Check for changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
      dev_sha: ${{ steps.diff.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check diff between dev and main
        id: diff
        run: |
          git fetch origin dev main
          DEV_SHA=$(git rev-parse origin/dev)
          echo "dev_sha=$DEV_SHA" >> $GITHUB_OUTPUT
          echo "Using dev commit: $DEV_SHA"

          if git diff --quiet origin/main...$DEV_SHA; then
            echo "No changes between dev and main."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected between dev and main."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  create-pr:
    name: "Create auto-merge PR"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check-diff]
    if: needs.check-diff.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-diff.outputs.dev_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
      - name: Create release branch from tested dev commit
        id: branch
        env:
          DEV_SHA: ${{ needs.check-diff.outputs.dev_sha }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          BRANCH="release/daily-prod-$DATE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin. Resetting it to tested dev commit."
            git push origin --delete "$BRANCH"
          fi

          git checkout -b "$BRANCH" "$DEV_SHA"
          git push origin "$BRANCH"

          echo "Release branch $BRANCH points at $DEV_SHA"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
      - name: Create or update PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          DATE="${{ steps.branch.outputs.date }}"
          DEV_SHA="${{ needs.check-diff.outputs.dev_sha }}"
          TITLE="chore: daily production release ($DATE)"
          BODY="Automated daily PR to merge \`dev\` into \`main\` via \`$BRANCH\` (pinned to \`$DEV_SHA\`)."

          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Existing PR #$EXISTING_PR found. Reusing it."
            PR_NUMBER="$EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY")
            PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
            echo "Created PR #$PR_NUMBER"
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pr_number }} --merge || gh pr merge ${{ steps.pr.outputs.pr_number }} --merge --auto
